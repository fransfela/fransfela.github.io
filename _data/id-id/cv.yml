- title: Pengalaman
  type: time_table
  contents:
    - title: R&D Engineer, Perceptual Audio-visual Evaluation
      institution: GN Store Nord / Jabra, Denmark
      year: 2022 - Sekarang
      description:
        - Merancang dan menjalankan studi persepsi dari tahap riset awal hingga rilis akhir, menyeimbangkan ketelitian statistik dengan kendala waktu produk nyata, dan menerjemahkan hasil menjadi rekomendasi teknis dan produk untuk tim lintas fungsi.
        - Membangun dan menjaga GN Global Assessor Panel (100+ anggota) sesuai ISO 8586:2012, mencakup desain penyaringan, pemantauan reliabilitas, dan konsistensi panel jangka panjang.
        - Membangun dan menjaga GEMA untuk audio/speech dan OPTIQ untuk image/video, kerangka evaluasi Python internal (90+ metrik objektif dan prediktif gabungan) yang kini dipakai di berbagai tim produk GN.
        - Berkontribusi pada riset dan pengembangan di berbagai lini produk GN bersama peneliti, membantu menentukan metrik evaluasi dan melakukan penilaian mendengar kritis terhadap kandidat solusi DSP.
        - Turut menulis proposal Innovation Fund Denmark yang telah diajukan (GN Store Nord, DTU, IT University of Copenhagen) tentang persepsi manusia terhadap video super-resolusi pada skenario rapat hibrida.
    - title: Industrial PhD Researcher
      institution: FORCE Technology (SenseLab) dan DTU, Denmark
      year: 2019 - 2022
      description:
        - Merancang dan menjalankan studi kualitas persepsi yang menggabungkan audio spasial dan video 360°, menghubungkan pengukuran objektif, kondisi dengar simulasi, dan respons manusia; merilis dataset HOA-SSR yang bersifat open-access.
        - Melakukan pengujian benchmark atas permintaan klien untuk webcam profesional dan konsumen, menilai kualitas gambar dan audio dalam kondisi jaringan transmisi nyata.
        - Menerapkan metode psikofisik, termasuk pelacakan gerak kepala-mata, untuk memodelkan perilaku dengar dan lihat nyata dalam lingkungan imersif.

