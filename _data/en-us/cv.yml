- title: Experience
  type: time_table
  contents:
    - title: R&D Engineer, Perceptual Audio-visual Evaluation
      institution: GN Store Nord / Jabra, Denmark
      year: 2022 - Present
      description:
        - Design and run perceptual studies from early research concepts through final release, balancing statistical rigor against real product-timeline constraints, and translate findings into technical and product recommendations for cross-functional teams.
        - Established and maintain the GN Global Assessor Panel (100+ members) under ISO 8586:2012, covering screener design, reliability monitoring, and long-term panel consistency.
        - Built and maintain GEMA for audio/speech and OPTIQ for image/video, internal Python evaluation frameworks (90+ objective and predictive metrics combined) now used across multiple GN product teams.
        - Contribute to research and development across GN product lines in collaboration with research scientists, helping define evaluation metrics and conducting critical listening assessment of DSP candidate solutions.
        - Co-authored a submitted Innovation Fund Denmark proposal (GN Store Nord, DTU, IT University of Copenhagen) on human perception of super-resolution video in hybrid meeting scenarios.
    - title: Industrial PhD Researcher
      institution: FORCE Technology (SenseLab) and DTU, Denmark
      year: 2019 - 2022
      description:
        - Designed and ran perceptual quality studies combining spatial audio and 360° video, connecting objective measurement, simulated listening conditions, and human response; released the open-access HOA-SSR dataset.
        - Conducted client-commissioned benchmark testing of professional and consumer webcams for image and audio quality under real transmission-network conditions.
        - Applied psychophysical methods, including head-eye motion tracking, to model real listening and viewing behavior in immersive environments.

